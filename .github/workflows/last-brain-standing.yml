name: Last Brain Standing checks

on:
  push:
    branches:
      - game/last-brain-standing
    paths:
      - "games/last-brain-standing/**"
      - ".github/workflows/last-brain-standing.yml"
  pull_request:
    paths:
      - "games/last-brain-standing/**"
      - ".github/workflows/last-brain-standing.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/last-brain-standing
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run regression tests
        run: npm test
      - name: Build production bundle
        run: npm run build
